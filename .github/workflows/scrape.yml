name: IIX Prefix Scraper

on:
  schedule:
    # 23:28 UTC is 06:28 WIB the next day
    - cron: '28 23 * * *'
  workflow_dispatch:   # Allows you to run it manually from the "Actions" tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install Dependencies
        run: |
          uv sync
          uv run playwright install chromium --with-deps

      - name: Run Scraper
        run: uv run main.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prefix.txt all-prefix.txt
          # Only commit if there are changes to the files
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prefix lists [skip ci]" && git push)